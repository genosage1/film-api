name: 定时采集并更新 aa.jsonon:  schedule:    - cron: '0 */6 * * *'  workflow_dispatch:jobs:  crawl:    runs-on: ubuntu-latest    steps:      - name: 检出代码        uses: actions/checkout@v4      - name: 设置 Python        uses: actions/setup-python@v5        with:          python-version: '3.11'      - name: 安装依赖        run: |          python -m pip install --upgrade pip          pip install -r requirements.txt      - name: 运行采集        run: python run_crawl.py      - name: 提交更新        run: |          git config --local user.email "action@github.com"          git config --local user.name "GitHub Action"          git add static/aa.json film.db          git diff --staged --quiet || git commit -m "auto: update data"          git push
